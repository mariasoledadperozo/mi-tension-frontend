name: mi_tension
description: "TFG para DAM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  http: ^1.2.1
  pinput: ^5.0.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  flutter_local_notifications: ^16.3.3
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/verificarCodigo/
    - assets/images/home/
    - assets/images/pressureAnalysis/
  fonts:
    - family: sf
      fonts:
        - asset: assets/fonts/sf-pro-rounded.ttf